# One command: `docker compose up --build`
#
# Start-up order:
#   ollama       -> LLM server
#   ollama-pull  -> one-off: downloads the chat model into the ollama volume
#   ingest       -> one-off: builds the vector store (skipped if it already exists)
#   api          -> FastAPI app, starts only after both one-off jobs succeed

x-app: &app
  build: .
  image: medical-ai-chatbot:latest

services:
  ollama:
    image: ollama/ollama:0.40.9
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ingest:
    <<: *app
    command: ["python", "ingest.py"]
    volumes:
      - chroma_data:/app/chromadb_store
    restart: "no"

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DATABASE_URL: sqlite:////app/data/medical_chatbot.db
    volumes:
      - chroma_data:/app/chromadb_store
      - app_data:/app/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  ollama_data:
  chroma_data:
  app_data:
