version: '3.8'

services:
  # 1. خدمة الـ FastAPI
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # يخلي main.py يتصل بـ Ollama جوا نفس الشبكة بدل localhost
      - HF_HUB_OFFLINE=1
    env_file:
      - .env   # لتحميل SECRET_KEY وغيره
    networks:
      - app-network
    depends_on:
      - ollama

  # 2. خدمة Ollama (بتشغّل الموديل اللي بيستخدمه main.py)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    # ملاحظة: أول مرة لازم تسحب الموديل داخل الحاوية:
    # docker compose exec ollama ollama pull llama3.2:1b

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data: